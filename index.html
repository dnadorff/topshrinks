<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Top Shrinks</title>
<meta name="description" content="Psychology head-to-head card game for 1 to 5 players. Works offline.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Top Shrinks"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#E9ECF2" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#11151F" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
/* Layout: one phone-width column. Sticky top bar, a seat strip, then one big trading card with its seven stats as tap targets. */
:root{
  --bg:#E9ECF2; --surface:#FFFFFF; --ink:#1B2238; --muted:#596277; --line:#CCD3DE;
  --accent:#D9480F; --accent-ink:#FFFFFF; --good:#1E7A4F; --warn:#9A5B00; --focus:#1F6FEB;
  --card:#FBFAF7; --card-ink:#1B2238;
  --f-pioneers:#7A5A2B; --f-behavior:#2E6B30; --f-dev:#B4400B; --f-clinical:#1D4FC4; --f-social:#9B1652;
  --f-cognitive:#6A2BC9; --f-bio:#0E6F67; --f-io:#56651A; --f-personality:#8F5A07;
  --font-display:ui-serif,"New York","Iowan Old Style",Georgia,serif;
  --font-body:-apple-system,system-ui,"Segoe UI",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11151F; --surface:#1B2130; --ink:#EDF0F6; --muted:#A5AEBF; --line:#323C52;
    --accent:#FF7A3D; --accent-ink:#1A0E06; --good:#4CC28C; --warn:#E5AE4E; --focus:#7AB4FF;
    --card:#20273A; --card-ink:#EDF0F6;
    --f-pioneers:#C49A5C; --f-behavior:#6DBA6F; --f-dev:#F08A4B; --f-clinical:#7FA4FF; --f-social:#F06BA8;
    --f-cognitive:#B48CFF; --f-bio:#4CC9BC; --f-io:#B5C55A; --f-personality:#E0AE4A;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:12px;padding-bottom:28px}
h1,h2,h3{font-family:var(--font-display);margin:0;line-height:1.1;text-wrap:balance}
h1{font-size:2.5rem;font-weight:700}
h2{font-size:1.45rem;font-weight:700}
h3{font-size:1.1rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:.88rem}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
[tabindex="-1"]:focus{outline:none}
.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:10px 8px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--font-display);font-weight:700;font-size:1.25rem;display:flex;align-items:center;gap:8px}
.brand .mark{width:30px;height:30px;border-radius:8px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:1rem}
.meta{font-size:.85rem;color:var(--muted);text-align:center;flex:1;min-width:0}
.pillbtn{font:inherit;font-weight:700;font-size:.9rem;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}

.btn{font:inherit;font-weight:700;font-size:1.02rem;border-radius:14px;padding:13px 16px;cursor:pointer;width:100%;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);text-align:center}
.btn-primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn-accent{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn small{display:block;font-weight:400;font-size:.85rem;opacity:.85;margin-top:2px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 140px;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
label{font-weight:700;font-size:.92rem}
input[type=text],select{font:inherit;font-size:1rem;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);width:100%;min-width:0}
.seatrow{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
.seatrow .field{display:flex;flex-direction:column;gap:4px;min-width:0}
.xbtn{font:inherit;font-weight:700;width:42px;height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg);padding:4px;border-radius:12px;border:1.5px solid var(--line)}
.seg button{font:inherit;font-weight:700;padding:9px 6px;border:0;border-radius:9px;background:transparent;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.18)}
.hero{padding-block:18px 4px;display:flex;flex-direction:column;gap:8px}
.hero .tag{font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.78rem;color:var(--accent)}
.code{font-family:ui-monospace,Menlo,monospace;font-size:2.2rem;font-weight:700;letter-spacing:.12em;text-align:center;padding:10px;border-radius:12px;background:var(--bg);border:2px dashed var(--line)}

/* seat strip */
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:6px}
.chip{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:6px 8px;min-width:0;display:flex;flex-direction:column;gap:1px}
.chip.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.chip.out{opacity:.55}
.chip .nm{font-weight:700;font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .ct{font-family:var(--font-display);font-size:1.3rem;font-weight:700;line-height:1}
.chip .sub{font-size:.74rem;color:var(--muted)}
.potline{font-size:.85rem;color:var(--muted);text-align:center}

.callbar{border-radius:14px;padding:10px 12px;background:var(--surface);border:1.5px solid var(--line);display:flex;flex-direction:column;gap:2px}
.callbar b{font-family:var(--font-display);font-size:1.2rem}

/* the trading card */
.tcard{--fc:var(--f-clinical);background:var(--card);color:var(--card-ink);border-radius:20px;border:3px solid var(--fc);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 10px 24px -16px rgba(0,0,0,.6)}
.tcard .head{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:12px;align-items:center;background:color-mix(in srgb,var(--fc) 14%,var(--card))}
.portrait{width:96px;height:96px;border-radius:14px;object-fit:cover;border:2px solid var(--fc);background:var(--fc)}
.initials{width:96px;height:96px;border-radius:14px;display:grid;place-items:center;background:var(--fc);color:#fff;font-family:var(--font-display);font-size:2.1rem;font-weight:700;letter-spacing:.02em}
.tcard .nm{font-family:var(--font-display);font-size:1.35rem;font-weight:700;line-height:1.1}
.fieldtag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--fc);margin-top:4px}
.tcard .yrs{font-size:.85rem;color:var(--muted)}
.landmark{padding:8px 12px;font-size:.9rem;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.landmark b{font-variant-numeric:tabular-nums}
.stats{display:flex;flex-direction:column}
.stat{font:inherit;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 12px;border:0;border-bottom:1px solid var(--line);background:transparent;color:inherit;text-align:left;min-height:48px}
.stat:last-child{border-bottom:0}
button.stat{cursor:pointer}
button.stat:hover,button.stat:active{background:color-mix(in srgb,var(--fc) 12%,transparent)}
.stat .lab{font-weight:700;font-size:.98rem}
.stat .hint{display:block;font-weight:400;font-size:.76rem;color:var(--muted)}
.stat .val{font-family:var(--font-display);font-size:1.45rem;font-weight:700;font-variant-numeric:tabular-nums;min-width:3.2ch;text-align:right}
.stat.hit{background:color-mix(in srgb,var(--accent) 16%,transparent)}
.fact{padding:10px 12px;font-size:.86rem;color:var(--muted);border-top:1px solid var(--line);font-style:italic}
.catlist{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* reveal */
.rev{display:flex;flex-direction:column;gap:8px}
.revrow{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-left:6px solid var(--fc);border-radius:12px;padding:8px}
.revrow.win{border-color:var(--good);border-left-color:var(--fc);box-shadow:0 0 0 2px var(--good)}
.revrow .portrait,.revrow .initials{width:52px;height:52px;border-radius:10px;font-size:1.1rem}
.revrow .who{font-size:.8rem;color:var(--muted)}
.revrow .cn{font-weight:700;line-height:1.2}
.revrow .v{font-family:var(--font-display);font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums}
.badge{display:inline-block;font-size:.72rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1.5px solid currentColor}
.badge.win{color:var(--good)} .badge.tie{color:var(--warn)}
.banner{background:var(--ink);color:var(--bg);border-radius:16px;padding:14px;text-align:center;display:flex;flex-direction:column;gap:4px}
.banner .big{font-family:var(--font-display);font-size:1.6rem;font-weight:700;line-height:1.15}
.checkcode{font-family:ui-monospace,Menlo,monospace;font-weight:700;font-size:1.2rem;letter-spacing:.1em}

/* gallery */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.mini{font:inherit;color:inherit;text-align:left;cursor:pointer;background:var(--surface);border:1.5px solid var(--line);border-left:6px solid var(--fc);border-radius:12px;padding:8px;display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:center;min-width:0}
.mini .portrait,.mini .initials{width:44px;height:44px;border-radius:9px;font-size:1rem;border-width:1px}
.mini .cn{font-weight:700;font-size:.88rem;line-height:1.2}
.mini .fl{font-size:.72rem;color:var(--muted)}
dialog{border:0;border-radius:18px;padding:0;background:var(--bg);color:var(--ink);width:min(94vw,520px);max-height:88vh}
dialog::backdrop{background:rgba(8,10,18,.6)}
.dlg{padding:14px;display:flex;flex-direction:column;gap:12px;max-height:88vh;overflow:auto}
.dlg ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.credits li{font-size:.82rem}
@media (prefers-reduced-motion:no-preference){.tcard.deal{animation:deal .3s ease-out}}
@keyframes deal{from{transform:translateY(8px) scale(.98);opacity:0}to{transform:none;opacity:1}}
</style></head>

</div>

// Top Shrinks rules engine. Pure functions, deterministic from a seed, so every phone in mirror mode computes the same game.
const DECK_VERSION = 1;
const CATS = [
  { key: 'longevity', label: 'Longevity', short: 'Longevity', hint: 'Age reached, or current age', low: false, unit: ' yrs' },
  { key: 'vintage', label: 'Vintage', short: 'Vintage', hint: 'Year of landmark work. Earliest wins', low: true, unit: '' },
  { key: 'reach', label: 'Theoretical Reach', short: 'Reach', hint: 'How far the ideas spread', low: false, unit: '' },
  { key: 'impact', label: 'Real-World Impact', short: 'Impact', hint: 'Changed practice, policy, or lives', low: false, unit: '' },
  { key: 'fame', label: 'Pop-Culture Fame', short: 'Fame', hint: 'Would your neighbor know the name?', low: false, unit: '' },
  { key: 'irb', label: 'IRB Nightmare', short: 'IRB', hint: 'How much a modern ethics board would panic', low: false, unit: '' },
  { key: 'underrated', label: 'Underrated', short: 'Underrated', hint: 'Deserves more credit than they get', low: false, unit: '' },
];
const LEVELS = ['human', 'easy', 'normal', 'sharp'];
const MAX_ROUNDS = 400;

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hash32(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

// value where higher is always better (Vintage flipped)
function score(cardId, cat) { const v = CARDS[cardId].s[cat]; return CATS[cat].low ? -v : v; }

function newGame(cfg) {
  // cfg: { seed, seats: [level strings], quick: bool }
  const rnd = mulberry32(cfg.seed);
  const ids = CARDS.map(c => c.id);
  for (let i = ids.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }
  const deck = cfg.quick ? ids.slice(0, 20) : ids;
  const n = cfg.seats.length, per = Math.floor(deck.length / n);
  const hands = Array.from({ length: n }, () => []);
  for (let k = 0; k < per * n; k++) hands[k % n].push(deck[k]);
  const pot = deck.slice(per * n);
  return { cfg, hands, pot, chooser: cfg.seed % n, round: 1, over: false, winners: [], last: null, hist: [], capped: false };
}

const active = st => st.hands.map((h, i) => h.length ? i : -1).filter(i => i >= 0);

function play(st, cat) {
  if (st.over) return st;
  const snap = JSON.stringify({ hands: st.hands, pot: st.pot, chooser: st.chooser, round: st.round, over: st.over, winners: st.winners, last: st.last, capped: st.capped });
  st.hist.push(snap); if (st.hist.length > 40) st.hist.shift();
  const players = active(st);
  const played = players.map(i => ({ seat: i, card: st.hands[i].shift() }));
  let best = -Infinity; for (const p of played) best = Math.max(best, score(p.card, cat));
  const top = played.filter(p => score(p.card, cat) === best).map(p => p.seat);
  const chooser = st.chooser;
  let winner = null;
  if (top.length === 1) {
    winner = top[0];
    var taken = played.length + st.pot.length;
    const mine = played.find(p => p.seat === winner).card;
    st.hands[winner].push(mine, ...played.filter(p => p.seat !== winner).map(p => p.card), ...st.pot);
    st.pot = [];
    st.chooser = winner;
  } else {
    st.pot.push(...played.map(p => p.card));
  }
  st.last = { round: st.round, cat, chooser, played, top, winner, potSize: st.pot.length, taken: winner === null ? 0 : taken };
  st.round++;
  const left = active(st);
  if (winner === null && !st.hands[st.chooser].length) {
    // chooser ran out in a tie: next seat clockwise that still has cards
    const n = st.hands.length;
    for (let k = 1; k <= n; k++) { const c = (st.chooser + k) % n; if (st.hands[c].length) { st.chooser = c; break; } }
  }
  if (left.length <= 1) {
    st.over = true;
    if (left.length === 1) { st.winners = left; st.hands[left[0]].push(...st.pot); st.pot = []; }
    else st.winners = top; // everyone tied out on their last cards
  } else if (st.round > MAX_ROUNDS) {
    st.over = true; st.capped = true;
    const most = Math.max(...st.hands.map(h => h.length));
    st.winners = st.hands.map((h, i) => h.length === most ? i : -1).filter(i => i >= 0);
  }
  return st;
}

function undo(st) {
  if (!st.hist.length) return false;
  Object.assign(st, JSON.parse(st.hist.pop()));
  return true;
}

// Robot picks only from its own card and public knowledge of the deck. It never sees other players' cards.
function robotChoice(st) {

    for (const c of CARDS) { const v = score(c.id, k); if (v < mine) below++; else if (v === mine) eq++; }
    return (below + (eq - 1) / 2) / (CARDS.length - 1);

  if (level === 'normal') return rnd() < 0.7 ? order[0][1] : order[1][1];

  v.append(el('div', { class: 'banner' }, el('div', { class: 'big' }, outcome)));
  const won = L.played.find(p => p.seat === L.winner);
  if (won) v.append(el('p', { class: 'small muted' }, CARDS[won.card].name + ': ' + CARDS[won.card].fact));
  if (G.mode === 'mirror') v.append(el('div', { class: 'panel', style: 'flex-direction:row;align-items:center;justify-content:space-between' },
    el('span', { class: 'small' }, 'Check code. Every phone should match:'), el('span', { class: 'checkcode' }, Engine.checkCode(st))));
  v.append(el('div', { class: 'row' },
    el('button', { class: 'btn', type: 'button', onclick: () => { Engine.undo(st); G.phase = decide(); render(); } }, 'Undo (mis-tap)'),
    el('button', { class: 'btn btn-accent', type: 'button', onclick: () => { G.phase = decide(); render(); } }, st.over ? 'See who won' : 'Next round')));
  announce(outcome);
}

function renderOver(v) {
  const st = G.st, w = st.winners;
  const names = w.map(nameOf);
  const big = w.length === 1 ? `${names[0]} wins!` : w.length ? `${names.join(' and ')} share the win` : 'Nobody wins';
  v.append(el('div', { class: 'banner' }, el('div', { class: 'big', tabindex: '-1' }, big),
    el('div', null, st.capped ? 'Time was called after a very long game. Most cards wins.' : `After ${plural(st.round - 1, 'round')}.`)));
  v.append(...strip());
  v.append(el('div', { class: 'row' },
    el('button', { class: 'btn', type: 'button', onclick: () => { G = null; view = 'home'; render(); } }, 'Home'),
    el('button', { class: 'btn btn-accent', type: 'button', onclick: () => {
      const cfg = Object.assign({}, st.cfg, { seed: G.mode === 'mirror' ? (st.cfg.seed + 1) % 1048576 : randSeed() });
      startGame(G.mode, cfg, G.names, G.seat);
    } }, 'Play again, same players')));
  if (G.mode === 'mirror') v.append(el('p', { class: 'small muted' }, 'In a mirror game, everyone taps "Play again" and the phones deal the same new game.'));
  announce(big);
}

function renderDeck(v) {
  v.append(el('h2', { tabindex: '-1' }, 'The deck'));
  v.append(el('p', { class: 'muted small' }, 'Tap a card to see it full size.'));
  v.append(el('div', { class: 'grid' }, CARDS.map(c => el('button', { class: 'mini', type: 'button', style: fc(c), onclick: () => openCard(c.id) },
    portrait(c), el('span', { style: 'min-width:0' }, el('span', { class: 'cn', style: 'display:block' }, c.name), el('span', { class: 'fl' }, FIELD_NAME[c.field] || c.field))))));
  v.append(el('button', { class: 'btn', type: 'button', onclick: () => { view = 'home'; render(); } }, 'Back'));
}
function openCard(id) {
  const b = $('cardDlgBody'); b.innerHTML = '';
  b.append(cardView(id), CARDS[id].credit ? el('p', { class: 'small muted' }, 'Photo: ' + CARDS[id].credit) : el('p', { class: 'small muted' }, 'No freely licensed photo was available, so this card shows initials.'),
    el('button', { class: 'btn', type: 'button', onclick: () => $('cardDlg').close() }, 'Close'));
  $('cardDlg').showModal();
}

/* ---------- menu ---------- */
function openMenu(confirmQuit) {
  const b = $('menuBody'); b.innerHTML = '';
  b.append(el('h2', { id: 'menuTitle' }, 'How to play'),
    el('ul', null,
      el('li', null, 'Cards are dealt evenly. You only ever see your own top card.'),
      el('li', null, 'The caller picks one category on their card and says it out loud.'),
      el('li', null, 'Everyone compares that category. The highest number wins, except Vintage, where the earliest year wins. The winner takes every card played and calls next.'),
      el('li', null, 'If the top cards tie, they go to the middle and the same caller goes again. The next winner takes the middle pile too.'),
      el('li', null, 'Run out of cards and you are out. The last player holding cards wins.'),
      el('li', null, 'Mirror games: every phone deals the same cards from the game code. When someone calls a category, everyone taps it on their own phone. After each round all phones should show the same check code. If one does not, that phone mis-tapped and should tap Undo.'),
      el('li', null, 'Robots only know their own card, never yours.')),
    el('p', { class: 'small muted' }, 'Longevity and Vintage are facts. The other five categories are playful ratings, balanced so every card can beat every other card in at least one category.'));
  if (G && !G.st.over && G.st.hist.length) b.append(el('button', { class: 'btn', type: 'button', onclick: () => { Engine.undo(G.st); G.phase = decide(); $('menu').close(); render(); } }, 'Undo the last round'));
  if (G) b.append(confirmQuit
    ? el('div', { class: 'row' }, el('button', { class: 'btn btn-accent', type: 'button', onclick: () => { G = null; view = 'home'; $('menu').close(); render(); } }, 'Yes, end this game'),
        el('button', { class: 'btn', type: 'button', onclick: () => openMenu(false) }, 'Keep playing'))
    : el('button', { class: 'btn', type: 'button', onclick: () => openMenu(true) }, 'End this game'));
  const credits = CARDS.filter(c => c.credit).map(c => el('li', null, `${c.name}: ${c.credit}`));
  b.append(el('details', null, el('summary', null, 'Photo credits'), el('ul', { class: 'credits' }, credits)),
    el('button', { class: 'btn', type: 'button', onclick: () => $('menu').close() }, 'Close'));
  if (!$('menu').open) $('menu').showModal();
}
$('menuBtn').addEventListener('click', () => openMenu(false));

/* ---------- boot ---------- */
(function boot() {
  const s = load();
  if (s) { draft = s.draft || null; if (s.G && s.G.st && s.G.st.cfg) G = s.G; }
  render();
})();
</script>
